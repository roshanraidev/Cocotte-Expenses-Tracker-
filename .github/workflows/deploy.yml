name: Deploy Cocotte to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cocotte-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$AWS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to Lightsail
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          ssh -o BatchMode=yes ubuntu@"$AWS_HOST" 'bash -se' <<'REMOTE'
            set -e
            cd /home/ubuntu/Cocotte-Expenses-Tracker-

            # Refuse to replace code underneath a legacy worker. No job/database cleanup.
            if pgrep -f '[n]pm run worker:sales|[s]cripts/workers/sales\.(ts|js)' >/dev/null; then
              echo 'Deployment blocked: stop the existing sales worker before this daily-only release.'
              exit 1
            fi
            for account in ubuntu root; do
              if ! cron_entries="$(sudo -n crontab -u "$account" -l 2>&1)"; then
                if ! printf '%s' "$cron_entries" | grep -q 'no crontab'; then
                  echo 'Deployment blocked: unable to inspect worker cron configuration.'
                  exit 1
                fi
                cron_entries=''
              fi
              if printf '%s' "$cron_entries" | grep -Eq 'resume-preserved-history|sales-history-check|worker:sales|scripts/workers/sales'; then
                echo 'Deployment blocked: review the existing sales worker/backfill cron entry.'
                exit 1
              fi
            done
            timers="$(systemctl list-timers --all --no-legend)"
            if printf '%s' "$timers" | grep -Eiq 'cocotte.*(histor|backfill)'; then
              echo 'Deployment blocked: historical sales timer still configured.'
              exit 1
            fi
            echo 'Legacy worker preflight passed; no matching worker process, cron entry or historical timer.'

            git fetch origin main
            git reset --hard origin/main

            npm ci
            npm run build

            sudo -n systemctl restart cocotte.service
            sudo systemctl is-active --quiet cocotte.service
          REMOTE
